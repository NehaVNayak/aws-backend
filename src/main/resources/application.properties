server.port=${SERVER_PORT:8085}

# Multipart Upload Limits (Supports uploads up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# AWS S3 Configuration (Populated from .env or Environment Variables)
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}
aws.sessionToken=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:}

# Logging
logging.level.com.example.s3microservice=INFO
logging.level.software.amazon.awssdk=WARN
